<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agentic Company Assistant</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fb; color: #1f2937; }
    .shell { max-width: 900px; margin: 40px auto; padding: 20px; }
    .card { background: white; border-radius: 14px; padding: 24px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
    .row { display: flex; gap: 10px; margin-top: 16px; }
    select, input, button { font-size: 16px; padding: 12px; border-radius: 8px; border: 1px solid #d1d5db; }
    input { flex: 1; }
    button { cursor: pointer; }
    #chat { min-height: 320px; max-height: 500px; overflow-y: auto; padding: 12px 0; }
    .msg { padding: 10px 12px; margin: 8px 0; border-radius: 10px; background: #f3f4f6; }
    .user { font-weight: 600; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <h1>Agentic Company Assistant</h1>
      <p>Starter UI for role-aware company knowledge, tools, ordering, and later phone automation.</p>
      <label for="role">Current role</label>
      <select id="role">
        <option>Customer</option>
        <option>Employee</option>
        <option>Manager</option>
        <option>Admin</option>
      </select>
      <div id="chat"></div>
      <div class="row">
        <input id="message" placeholder="Ask about products, policies, orders..." />
        <button id="send">Send</button>
      </div>
    </div>
  </div>
<script>
const chat = document.getElementById('chat');
const message = document.getElementById('message');
const role = document.getElementById('role');

async function send() {
  const text = message.value.trim();
  if (!text) return;
  chat.insertAdjacentHTML('beforeend', `<div class="msg"><span class="user">You:</span> ${escapeHtml(text)}</div>`);
  message.value = '';

  const response = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text, role: role.value })
  });

  const data = await response.json();
  const answer = data.answer ?? data.error ?? 'Something went wrong.';
  chat.insertAdjacentHTML('beforeend', `<div class="msg"><strong>Assistant:</strong> ${escapeHtml(answer)}</div>`);
  chat.scrollTop = chat.scrollHeight;
}

function escapeHtml(value) {
  const div = document.createElement('div');
  div.textContent = value;
  return div.innerHTML;
}

document.getElementById('send').addEventListener('click', send);
message.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
